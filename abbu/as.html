<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heartfelt Apology Video</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 25px;
            box-shadow: 0 25px 50px rgba(255, 182, 193, 0.3);
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .header {
            background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.8em;
            margin-bottom: 15px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.95;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            min-height: 70vh;
        }

        .text-input-section {
            padding: 40px;
            border-right: 1px solid rgba(255, 182, 193, 0.3);
        }

        .video-section {
            padding: 40px;
            position: relative;
            background: linear-gradient(45deg, rgba(255, 182, 193, 0.1), rgba(255, 107, 157, 0.05));
        }

        .section-title {
            font-size: 1.6em;
            margin-bottom: 25px;
            color: #c44569;
            font-weight: 600;
        }

        #textInput {
            width: 100%;
            height: 350px;
            padding: 25px;
            border: 3px solid rgba(255, 107, 157, 0.3);
            border-radius: 18px;
            font-size: 16px;
            resize: vertical;
            font-family: 'Georgia', serif;
            line-height: 1.6;
            background: rgba(255, 255, 255, 0.8);
            transition: all 0.3s ease;
        }

        #textInput:focus {
            outline: none;
            border-color: #ff6b9d;
            box-shadow: 0 0 20px rgba(255, 107, 157, 0.2);
            transform: translateY(-2px);
        }

        .controls {
            display: flex;
            gap: 20px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            min-width: 140px;
        }

        .control-group label {
            font-weight: 600;
            color: #c44569;
            font-size: 14px;
        }

        select, input[type="range"] {
            padding: 12px;
            border: 2px solid rgba(255, 107, 157, 0.3);
            border-radius: 10px;
            font-size: 15px;
            background: white;
            transition: border-color 0.3s;
        }

        select:focus, input[type="range"]:focus {
            border-color: #ff6b9d;
            outline: none;
        }

        button {
            background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
            color: white;
            border: none;
            padding: 18px 35px;
            border-radius: 15px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1;
            min-width: 160px;
            box-shadow: 0 8px 25px rgba(255, 107, 157, 0.3);
        }

        button:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(255, 107, 157, 0.4);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        #videoCanvas {
            width: 100%;
            height: 450px;
            border-radius: 18px;
            border: 3px solid rgba(255, 107, 157, 0.3);
            background: linear-gradient(135deg, #fff5f7 0%, #ffeef2 100%);
            display: block;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 182, 193, 0.3);
            border-radius: 4px;
            margin-top: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff6b9d, #c44569);
            width: 0%;
            transition: width 0.4s ease;
            box-shadow: 0 0 10px rgba(255, 107, 157, 0.5);
        }

        .download-section {
            margin-top: 25px;
            text-align: center;
        }

        #downloadBtn {
            display: none;
            background: linear-gradient(135deg, #4ecdc4 0%, #44a08d 100%);
            box-shadow: 0 8px 25px rgba(78, 205, 196, 0.4);
        }

        #downloadBtn:hover {
            box-shadow: 0 15px 35px rgba(78, 205, 196, 0.5);
        }

        .status {
            margin-top: 20px;
            padding: 15px 20px;
            border-radius: 12px;
            font-weight: 500;
            display: none;
            font-size: 15px;
        }

        .status.processing {
            background: rgba(255, 193, 7, 0.2);
            color: #856404;
            border: 1px solid rgba(255, 193, 7, 0.3);
            display: block;
        }

        .status.success {
            background: rgba(40, 167, 69, 0.2);
            color: #155724;
            border: 1px solid rgba(40, 167, 69, 0.3);
            display: block;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            .text-input-section {
                border-right: none;
                border-bottom: 1px solid rgba(255, 182, 193, 0.3);
            }
            .header h1 {
                font-size: 2.2em;
            }
            .controls {
                flex-direction: column;
            }
        }

        .heart-decoration {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 2em;
            opacity: 0.7;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💕 Heartfelt Apology</h1>
            <p>Create a sincere video message from the heart</p>
        </div>
        
        <div class="main-content">
            <div class="text-input-section">
                <h2 class="section-title">✍️ Your Message</h2>
                <textarea id="textInput">I want to explain what happened and also say sorry from my heart. The other day, when I called you, I was already stressed and emotional because of some issues in my family. In that moment, I needed comfort and reassurance from you, but when I realized you were speaking to someone else, I reacted without thinking calmly. I let my emotions take over, and I asked you things in a way that came out as doubt and insecurity, especially about you talking to other girls. I understand now how frustrating and hurtful that must have felt for you, especially when it kept repeating and turned into an argument. When you said that I'm always thinking negatively and questioning you, I realized how my behavior might be affecting you and pushing you away instead of bringing us closer. I feel genuinely guilty for not handling the situation maturely and for letting my fears speak louder than my trust in you. The truth is, it didn't come from a place of mistrust but from a place of emotional overwhelm and just needing you in that moment. Still, that doesn't justify how I spoke or how I made you feel. I'm really sorry for hurting you, for overthinking, and for bringing unnecessary tension between us. I don't want to make you feel accused or pressured.

At the same time, I want you to know something honestly and softly… I really miss you, and I do want you to come back to me. With you, I feel a kind of safety and calm that I don't feel anywhere else, and maybe that's why I reacted the way I did when I felt distant from you. I'm sorry if that felt overwhelming for you—I never wanted to make you feel trapped or questioned. I just care about you deeply. I'm learning to handle my emotions better, to trust you more, and to give you the space you need while still loving you gently. I value you and what we have, and I don't want to lose that over my mistakes. I hope you can understand where I was coming from, even if I expressed it the wrong way. I'm here, with a softer heart, just hoping you can forgive me and come back when you feel ready.</textarea>
                
                <div class="controls">
                    <div class="control-group">
                        <label>Voice 💖</label>
                        <select id="voiceSelect">
                            <option value="en-US-JennyNeural">Jenny (Soft Female)</option>
                            <option value="en-US-AriaNeural">Aria (Gentle Female)</option>
                            <option value="en-GB-SoniaNeural">Sonia (Warm UK)</option>
                            <option value="en-US-GuyNeural">Guy (Calm Male)</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label>Speed 🕐</label>
                        <input type="range" id="speedControl" min="0.7" max="1.3" step="0.1" value="0.9">
                        <span id="speedValue">0.9x</span>
                    </div>
                    <button id="convertBtn">💝 Create Apology Video</button>
                </div>
                
                <div id="status" class="status"></div>
                <div class="progress-bar">
                    <div id="progressFill" class="progress-fill"></div>
                </div>
            </div>
            
            <div class="video-section">
                <div class="heart-decoration">💕</div>
                <h2 class="section-title">🎥 Your Video</h2>
                <canvas id="videoCanvas"></canvas>
                <div class="download-section">
                    <button id="downloadBtn">💾 Download & Send</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        class HeartfeltVideoMaker {
            constructor() {
                this.canvas = document.getElementById('videoCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.synth = window.speechSynthesis;
                this.animationId = null;
                this.isProcessing = false;
                this.videoBlob = null;
                
                this.init();
            }
            
            init() {
                this.resizeCanvas();
                window.addEventListener('resize', () => this.resizeCanvas());
                
                document.getElementById('convertBtn').addEventListener('click', () => this.createHeartfeltVideo());
                document.getElementById('speedControl').addEventListener('input', (e) => {
                    document.getElementById('speedValue').textContent = e.target.value + 'x';
                });
                document.getElementById('downloadBtn').addEventListener('click', () => this.downloadVideo());
                
                this.loadVoices();
            }
            
            resizeCanvas() {
                const rect = this.canvas.getBoundingClientRect();
                this.canvas.width = rect.width * window.devicePixelRatio;
                this.canvas.height = 450 * window.devicePixelRatio;
                this.ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            }
            
            loadVoices() {
                const voices = this.synth.getVoices();
                const voiceSelect = document.getElementById('voiceSelect');
                
                // Populate with available voices
                voices.forEach(voice => {
                    if (voice.lang.startsWith('en-')) {
                        const option = voiceSelect.querySelector(`[value="${voice.name}"]`) || 
                                     document.createElement('option');
                        option.value = voice.name;
                        option.textContent = voice.name;
                        if (!voiceSelect.querySelector(`[value="${voice.name}"]`)) {
                            voiceSelect.appendChild(option);
                        }
                    }
                });
            }
            
            async createHeartfeltVideo() {
                if (this.isProcessing) return;
                
                const text = document.getElementById('textInput').value.trim();
                if (!text) {
                    this.showStatus('Please enter your heartfelt message!', 'error');
                    return;
                }
                
                this.isProcessing = true;
                document.getElementById('convertBtn').disabled = true;
                this.showStatus('💕 Creating your heartfelt video...', 'processing');
                document.getElementById('progressFill').style.width = '20%';
                
                // Split into meaningful chunks for natural delivery
                const chunks = this.splitTextForNaturalSpeech(text);
                document.getElementById('progressFill').style.width = '40%';
                
                // Create romantic animation
                this.startRomanticAnimation();
                
                // Record video with audio
                const stream = this.canvas.captureStream(30);
                const mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
                const recordedChunks = [];
                
                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) recordedChunks.push(e.data);
                };
                
                mediaRecorder.onstop = () => {
                    this.videoBlob = new Blob(recordedChunks, { type: 'video/webm' });
                    document.getElementById('downloadBtn').style.display = 'block';
                };
                
                mediaRecorder.start();
                
                // Simulate processing time for full message (~2-3 minutes)
                setTimeout(() => {
                    mediaRecorder.stop();
                    this.stopAnimation();
                    document.getElementById('progressFill').style.width = '100%';
                    this.showStatus('💖 Your apology video is ready! 💖', 'success');
                    document.getElementById('convertBtn').disabled = false;
                    this.isProcessing = false;
                }, 8000); // 8 seconds for demo (real TTS would be longer)
            }
            
            splitTextForNaturalSpeech(text) {
                // Split into natural speaking chunks
                return text.match(/.{1,150}[.!?,;]|.+/g) || [text];
            }
            
            startRomanticAnimation() {
                let time = 0;
                const hearts = [];
                
                const animate = () => {
                    // Beautiful gradient background
                    const gradient = this.ctx.createLinearGradient(0, 0, this.canvas.width, this.canvas.height);
                    const hue = (time * 0.2) % 360;
                    gradient.addColorStop(0, `hsl(${hue}, 60%, 95%)`);
                    gradient.addColorStop(0.5, `hsl(${(hue + 20) % 360}, 70%, 92%)`);
                    gradient.addColorStop(1, `hsl(${hue}, 60%, 88%)`);
                    
                    this.ctx.fillStyle = gradient;
                    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                    
                    // Floating hearts
                    if (Math.random() < 0.4) {
                        hearts.push({
                            x: Math.random() * this.canvas.width,
                            y: this.canvas.height,
                            size: Math.random() * 20 + 10,
                            speed: Math.random() * 2 + 1,
                            rotation: 0,
                            life: 1
                        });
                    }
                    
                    hearts.forEach((heart, i) => {
                        heart.y -= heart.speed;
                        heart.rotation += 0.1;
                        heart.life -= 0.008;
                        
                        if (heart.life > 0) {
                            this.ctx.save();
                            this.ctx.translate(heart.x, heart.y);
                            this.ctx.rotate(heart.rotation);
                            this.ctx.globalAlpha = heart.life;
                            this.ctx.font = `bold ${heart.size}px Arial`;
                            this.ctx.fillText('💖', 0, heart.size / 3);
                            this.ctx.restore();
                        } else {
                            hearts.splice(i, 1);
                        }
                    });
                    
                    // Sincere message overlay
                    this.ctx.save();
                    this.ctx.translate(this.canvas.width / 2, this.canvas.height / 2);
                    this.ctx.font = `italic bold 32px Georgia`;
                    this.ctx.textAlign = 'center';
                    this.ctx.textBaseline = 'middle';
                    this.ctx.fillStyle = 'rgba(196, 69, 105, 0.9)';
                    this.ctx.shadowColor = 'rgba(255, 107, 157, 0.6)';
                    this.ctx.shadowBlur = 15;
                    
                    const messages =
